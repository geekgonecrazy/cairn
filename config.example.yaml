# Cairn server (cairnd) configuration.
# All values shown are the defaults — cairnd runs fine with no config file at all.
# Copy to config.yaml and pass it:  go run ./cmd/cairnd -configFile config.yaml

# HTTP listen address: Connect API + SSE realtime + blob gateway + the SPA.
address: ":8099"

# Storage backend. Only "sqlite" exists today.
store: "sqlite"

# SQLite database file. Dev phase has NO migrations — to reset, stop the server
# and delete this file (plus the -wal/-shm siblings) and blobDir.
sqlitePath: "cairn.db"

# Built SPA to serve at /__hub/ . Produced by `cd webapp && npm run build`.
# If the directory is absent, cairnd serves the API only and logs a note.
webappDir: "webapp/dist"

# Local blob store directory (the data plane). Holds ENCRYPTED, content-addressed
# objects only — never plaintext, never keys.
# NOTE: this is the local stand-in for iroh-store; see decisions.md §Deviations.
blobDir: "cairn-blobs"

# Hex-encoded household root public keys this node recognizes.
#
# The chain gate is DEFAULT-DENY: every sender must chain back to a trusted root
# (session key → device key → member root → household root) or its events are
# rejected.
#
# EMPTY (the default) does NOT mean "open". It means the carrier is *awaiting
# founding*: it refuses events until it stores its first attestation, which
# ADOPTS that household as its root (persisted; survives restart). From then on
# it enforces. This is the zero-config single-household path — the founder's
# browser founds it automatically.
#
# LIST roots here to pin them: adoption is disabled and the carrier is strict
# from the first event against exactly these roots. Needed when one carrier
# serves more than one household (e.g. the cmd/agent demo: pin both the agent's
# key and the human's household root).
trustedRoots: []
#   - "3f1a...."
