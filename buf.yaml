version: v2
modules:
  - path: proto
lint:
  use:
    - STANDARD
  except:
    # Our RPCs use bare Request/Response suffixes already; allow package-less
    # comment rules to relax during the dev phase.
    - COMMENT_ENUM
    - COMMENT_ENUM_VALUE
    - COMMENT_FIELD
    - COMMENT_MESSAGE
    - COMMENT_RPC
    - COMMENT_SERVICE
breaking:
  use:
    - FILE
