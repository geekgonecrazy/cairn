  .pt-who { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .pt-name {
    font-size: 13.5px;
    font-weight: 600;
    color: var(--text);
    display: flex; flex-direction: column;
    gap: 2px;
    min-width: 0;
  }
  .pt-name .agt-mini {
    display: inline-block;
    margin-left: 6px;
    font: 600 9px/1 var(--font-mono);
    border: 1px solid var(--text-3);
    padding: 1px 4px;
    border-radius: 2px;
    color: var(--text-2);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    vertical-align: middle;
  }
  .pt-name .pt-id {
    font: 500 11px/1 var(--font-mono);
    color: var(--text-3);
    font-weight: 500;
    letter-spacing: 0;
  }
  .pt-state {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font: 500 11.5px/1 var(--font-mono);
    color: var(--text-3);
    text-transform: lowercase;
    letter-spacing: 0.04em;
  }
  .pt-state.pos  { color: var(--pos);  }
  .pt-state.busy { color: var(--busy); }
  .pt-state.neg  { color: var(--neg);  }
  .pt-state .pip { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .pt-row[data-conn="ringing"] .pt-state .pip { animation: pulseDot 1.6s ease-in-out infinite; }
  .pt-meta { justify-self: end; }
  .pt-flag {
    display: inline-flex; align-items: center;
    font: 500 10.5px/1 var(--font-mono);
    color: var(--text-2);
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: var(--r-1);
    padding: 4px 7px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .pt-flag.mute {
    color: var(--neg);
    background: var(--neg-soft);
    border-color: color-mix(in oklab, var(--neg) 35%, var(--border));
  }
  .pt-flag.talk {
    color: var(--pos);
    background: var(--pos-soft);
    border-color: color-mix(in oklab, var(--pos) 35%, var(--border));
  }

  .transports {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .t-row {
    display: grid;
    grid-template-columns: minmax(180px, 1fr) minmax(120px, 2fr) auto;
    gap: 12px;
    align-items: center;
    padding: 8px 12px;
    border: 1px solid var(--border);
    border-radius: var(--r-2);
    background: var(--surface);
  }
  .t-row .t-name {
    font-size: 13px;
    color: var(--text);
    display: flex; align-items: center; gap: 8px;
  }
  .t-row .t-name code {
    font: 500 11px/1 var(--font-mono);
    color: var(--text-3);
    background: var(--surface-2);
    border: 1px solid var(--border);
    padding: 2px 5px;
    border-radius: 3px;
  }
  .t-row .t-bar {
    height: 5px;
    background: var(--surface-3);
    border-radius: 999px;
    overflow: hidden;
  }
  .t-row .t-bar > span {
    display: block;
    height: 100%;
    background: var(--accent);
    border-radius: 999px;
  }
  .t-row .t-state {
    font: 500 11px/1 var(--font-mono);
    color: var(--text-3);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .t-row .t-state.pos { color: var(--pos); }

  /* Provenance ico cell needs to allow avatars */
  .provenance .row .ico { display: inline-flex; align-items: center; justify-content: center; }

  /* ============== Room extras (members / settings / popovers) ============== */

  .detail .m-head .lockup .icon-wrap.members  { background: color-mix(in oklab, var(--accent) 14%, transparent); color: var(--accent); }
  .detail .m-head .lockup .icon-wrap.settings { background: var(--surface-2); color: var(--text-2); border: 1px solid var(--border); }

  /* shared mini-avatar (room extras) */
  .rx-av {
    border-radius: 50%;
    color: white;
    display: grid; place-items: center;
    font-size: 11px;
    font-weight: 600;
    flex-shrink: 0;
    background: var(--text-3);
    letter-spacing: -0.01em;
  }
  .rx-av.agent {
    border-radius: var(--r-1);
    background: var(--surface-3);
    color: var(--text);
    font-family: var(--font-mono);
    font-size: 10px;
    border: 1px solid var(--border-2);
  }
  .rx-av.group {
    border-radius: var(--r-2);
    background: var(--surface-2);
    border: 1px solid var(--border-2);
    color: var(--text-2);
  }

  /* Members modal */
  .rx-members .m-body { padding: 0; gap: 0; }
  .rx-bar {
    padding: 14px 22px 12px;
    display: flex;
    gap: 10px;
    align-items: center;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    position: sticky;
    top: 0;
    z-index: 1;
  }
  .rx-search {
    flex: 1;
    position: relative;
    display: flex;
    align-items: center;
  }
  .rx-search svg { position: absolute; left: 10px; color: var(--text-3); }
  .rx-search input {
    width: 100%;
    padding: 8px 10px 8px 30px;
    border: 1px solid var(--border);
    background: var(--surface);
    border-radius: var(--r-2);
    font-size: 13px;
    outline: none;
  }
  .rx-search input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

  .rx-list {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .rx-row {
    display: grid;
    grid-template-columns: 1fr auto auto;
    gap: 12px;
    align-items: center;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: var(--r-3);
    background: var(--surface);
  }
  .rx-row:hover { background: var(--surface-2); }
  .rx-who { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .rx-name { min-width: 0; }
  .rx-name .n {
    font-size: 13.5px;
    font-weight: 600;
    color: var(--text);
    display: flex; align-items: center; gap: 6px;
    flex-wrap: wrap;
  }
  .rx-name .n .agt-mini {
    font: 600 9px/1 var(--font-mono);
    border: 1px solid var(--text-3);
    padding: 1px 4px;
    border-radius: 2px;
    color: var(--text-2);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .rx-you {
    font: 500 10px/1 var(--font-mono);
    background: var(--accent-soft);
    color: var(--accent);
    border: 1px solid color-mix(in oklab, var(--accent) 30%, var(--border));
    padding: 2px 5px;
    border-radius: 3px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .rx-origin {
    font-size: 11.5px;
    color: var(--cross-tint);
    font-weight: 400;
  }
  .rx-sub {
    margin-top: 3px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--text-3);
    flex-wrap: wrap;
  }
  .rx-dot { width: 3px; height: 3px; border-radius: 50%; background: var(--text-4); }
  .rx-pres { display: inline-flex; align-items: center; gap: 5px; }
  .rx-pres .pip { width: 7px; height: 7px; border-radius: 50%; background: var(--text-3); }
  .rx-pres.pos  .pip { background: var(--pos);  }
  .rx-pres.pos      { color: var(--pos);  }
  .rx-pres.warn .pip { background: var(--warn); }
  .rx-pres.warn     { color: var(--warn); }
  .rx-pres.xh   .pip { background: var(--cross-tint); }
  .rx-pres.xh       { color: var(--cross-tint); }

  .rx-role {
    font: 500 10px/1 var(--font-mono);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-2);
    background: var(--surface-2);
    border: 1px solid var(--border);
    padding: 4px 8px;
    border-radius: var(--r-1);
  }
  .rx-role.owner { color: var(--accent); border-color: color-mix(in oklab, var(--accent) 30%, var(--border)); background: var(--accent-soft); }
  .rx-role.agent { color: var(--text); border-color: var(--border-2); }
  .rx-role.guest { color: var(--cross-tint); border-color: color-mix(in oklab, var(--cross-tint) 30%, var(--border)); background: color-mix(in oklab, var(--cross-tint) 10%, transparent); }

  .rx-actions { display: flex; gap: 4px; }
  .ico-btn {
    width: 30px; height: 30px;
    display: grid; place-items: center;
    background: none;
    border: 1px solid transparent;
    color: var(--text-3);
    border-radius: var(--r-2);
    cursor: pointer;
  }
  .ico-btn:hover { background: var(--surface); border-color: var(--border); color: var(--text); }

  /* Settings modal extras */
  .rx-opts { display: flex; flex-direction: column; gap: 6px; }
  .rx-opt {
    display: grid;
    grid-template-columns: 16px 1fr;
    gap: 12px;
    align-items: flex-start;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: var(--r-2);
    background: var(--surface);
    cursor: pointer;
  }
  .rx-opt input[type="radio"] { margin-top: 3px; accent-color: var(--accent); }
  .rx-opt[data-selected="true"] {
    border-color: color-mix(in oklab, var(--accent) 45%, var(--border));
    background: color-mix(in oklab, var(--accent) 5%, var(--surface));
  }
  .rx-opt .t { font-size: 13px; font-weight: 600; color: var(--text); }
  .rx-opt .s { font-size: 12px; color: var(--text-3); margin-top: 2px; line-height: 1.4; }
  .scope-grid .v select {
    width: 100%;
    padding: 7px 9px;
    border: 1px solid var(--border);
    background: var(--surface);
    border-radius: var(--r-2);
    font-size: 13px;
    color: var(--text);
    outline: none;
  }
  .scope-grid .v select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .rx-danger {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 12px;
    align-items: center;
    padding: 10px 12px;
    border: 1px solid color-mix(in oklab, var(--neg) 25%, var(--border));
    border-radius: var(--r-2);
    background: color-mix(in oklab, var(--neg) 4%, var(--surface));
    margin-bottom: 6px;
  }
  .rx-danger:last-child { margin-bottom: 0; }
  .rx-danger .t { font-size: 13px; font-weight: 600; color: var(--text); }
  .rx-danger .s { font-size: 12px; color: var(--text-3); margin-top: 2px; }

  /* Popovers (kebab / emoji / mention) */
  .rx-pop {
    position: fixed;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-3);
    box-shadow: var(--shadow-3);
    z-index: 60;
    overflow: hidden;
    animation: popIn 120ms ease-out;
  }
  @keyframes popIn { from { opacity: 0; transform: translateY(-2px); } to { opacity: 1; transform: translateY(0); } }

  .kebab-pop {
    width: 220px;
    padding: 4px;
    display: flex;
    flex-direction: column;
  }
  .rx-pop-item {
    display: grid;
    grid-template-columns: 18px 1fr auto;
    gap: 10px;
    align-items: center;
    padding: 7px 8px;
    border: none;
    background: none;
    color: var(--text);
    font-size: 13px;
    cursor: pointer;
    border-radius: var(--r-2);
    text-align: left;
  }
  .rx-pop-item:hover { background: var(--surface-2); }
  .rx-pop-item.danger { color: var(--neg); }
  .rx-pop-item .hint { font: 500 10.5px/1 var(--font-mono); color: var(--text-3); }
  .rx-pop-div {
    height: 1px;
    background: var(--border);
    margin: 4px 0;
  }

  /* Emoji picker */
  .emoji-pop {
    display: flex;
    flex-direction: column;
  }
  .emoji-search {
    padding: 8px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--surface);
  }
  .emoji-search svg { color: var(--text-3); flex-shrink: 0; margin-left: 4px; }
  .emoji-search input {
    flex: 1;
    border: none;
    outline: none;
    background: transparent;
    font-size: 13px;
    color: var(--text);
    padding: 4px 0;
  }
  .emoji-grid {
    flex: 1;
    overflow-y: auto;
    display: grid;
    grid-template-columns: repeat(8, minmax(0, 1fr));
    gap: 2px;
    padding: 8px;
    align-content: start;
  }
  .emoji-btn {
    border: none;
    background: none;
    font-size: 18px;
    cursor: pointer;
    padding: 0;
    width: 100%;
    height: 32px;
    border-radius: var(--r-1);
    transition: background 60ms;
    line-height: 1;
  }
  .emoji-btn:hover { background: var(--surface-2); }
  .emoji-tabs {
    border-top: 1px solid var(--border);
    background: var(--surface-2);
    display: flex;
    padding: 4px;
    gap: 2px;
  }
  .emoji-tab {
    flex: 1;
    border: none;
    background: none;
    font-size: 14px;
    padding: 6px 4px;
    border-radius: var(--r-1);
    cursor: pointer;
    line-height: 1;
  }
  .emoji-tab:hover { background: var(--surface); }
  .emoji-tab[aria-pressed="true"] { background: var(--surface); box-shadow: inset 0 0 0 1px var(--border); }

  /* Mention menu */
  .mention-pop {
    display: flex;
    flex-direction: column;
    max-height: 320px;
  }
  .mention-list {
    overflow-y: auto;
    padding: 4px;
  }
  .mention-section {
    padding: 8px 8px 4px;
    font: 600 10px/1 var(--font-mono);
    color: var(--text-3);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  .mention-row {
    display: grid;
    grid-template-columns: 28px 1fr;
    gap: 10px;
    align-items: center;
    padding: 7px 8px;
    cursor: pointer;
    border-radius: var(--r-2);
  }
  .mention-row[aria-selected="true"] { background: var(--surface-2); }
  .mention-row .n {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .mention-row .n .agt-mini {
    font: 600 9px/1 var(--font-mono);
    border: 1px solid var(--text-3);
    padding: 1px 3px;
    border-radius: 2px;
    color: var(--text-2);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .mention-row .rx-sub { margin-top: 1px; font-size: 11.5px; color: var(--text-3); }

  /* ============== Capabilities side card ============== */
  .cap-side-list {
    padding: 10px 12px 14px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .cap-side-row {
    padding: 9px 10px;
    border: 1px solid var(--border);
    border-radius: var(--r-2);
    background: var(--surface);
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .cap-side-row.state-pending {
    border-color: color-mix(in oklab, var(--warn) 35%, var(--border));
    background: color-mix(in oklab, var(--warn) 5%, var(--surface));
  }
  .cap-side-top {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .cap-side-name {
    font: 500 12px/1.3 var(--font-mono);
    color: var(--text);
    word-break: break-all;
    flex: 1;
  }
  .cap-side-tag {
    font: 500 9.5px/1 var(--font-mono);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    padding: 3px 6px;
    border-radius: 3px;
    border: 1px solid var(--border-2);
    color: var(--text-2);
    background: var(--surface-2);
    flex-shrink: 0;
  }
  .cap-side-tag.active {
    color: var(--pos);
    background: var(--pos-soft);
    border-color: color-mix(in oklab, var(--pos) 30%, var(--border));
  }
  .cap-side-tag.pending {
    color: var(--warn);
    background: color-mix(in oklab, var(--warn) 14%, transparent);
    border-color: color-mix(in oklab, var(--warn) 35%, var(--border));
  }
  .cap-side-meta {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11.5px;
    color: var(--text-3);
  }
  .cap-side-meta .dot { width: 3px; height: 3px; border-radius: 50%; background: var(--text-4); }

  /* ============== Sidebar toggle in room header (mobile + desktop) ============== */
  .room-header .actions .icon-btn[data-toggle="on"] {
    background: var(--accent-soft);
    color: var(--accent);
    border-color: color-mix(in oklab, var(--accent) 30%, var(--border));
  }

  /* ============== Mobile sidebar drawer ============== */
  .sidebar-scrim {
    display: none;
    position: fixed;
    inset: 0;
    background: color-mix(in oklab, oklch(0.05 0.01 260) 40%, transparent);
    z-index: 40;
  }
  @media (max-width: 900px) {
    .shell[data-panel="sidebar"] > .room-panel {
      display: block !important;
      position: fixed;
      top: 0; right: 0; bottom: 0;
      width: min(340px, 90vw);
      z-index: 45;
      transform: translateX(100%);
      transition: transform 220ms cubic-bezier(0.2, 0.8, 0.2, 1);
      border-left: 1px solid var(--border);
      box-shadow: var(--shadow-3);
    }
    .shell[data-sidebar-open="true"] > .room-panel { transform: translateX(0); }
    .shell[data-sidebar-open="true"] .sidebar-scrim { display: block; }
  }

  /* ============== Global call bar ============== */
  .global-call-bar {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 8px 16px 8px 14px;
    background: var(--surface);
    border-bottom: 1px solid color-mix(in oklab, var(--pos) 30%, var(--border));
    box-shadow: inset 0 2px 0 color-mix(in oklab, var(--pos) 80%, transparent);
    position: relative;
    z-index: 5;
  }
  .global-call-bar[data-state="ringing"] {
    border-bottom-color: color-mix(in oklab, var(--busy) 35%, var(--border));
    box-shadow: inset 0 2px 0 color-mix(in oklab, var(--busy) 80%, transparent);
  }
  .gcb-icon {
    width: 28px; height: 28px;
    border-radius: var(--r-2);
    display: grid; place-items: center;
    background: color-mix(in oklab, var(--pos) 14%, transparent);
    color: var(--pos);
    border: 1px solid color-mix(in oklab, var(--pos) 30%, var(--border));
    flex-shrink: 0;
  }
  .global-call-bar[data-state="ringing"] .gcb-icon {
    background: color-mix(in oklab, var(--busy) 14%, transparent);
    color: var(--busy);
    border-color: color-mix(in oklab, var(--busy) 30%, var(--border));
    animation: ringPulse 1.4s ease-in-out infinite;
  }
  .gcb-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
  .gcb-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 8px;
    letter-spacing: -0.005em;
  }
  .gcb-title .gcb-state {
    font: 600 10px/1 var(--font-mono);
    color: var(--pos);
    background: var(--pos-soft);
    border: 1px solid color-mix(in oklab, var(--pos) 30%, var(--border));
    padding: 2px 5px;
    border-radius: 3px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .global-call-bar[data-state="ringing"] .gcb-title .gcb-state {
    color: var(--busy);
    background: var(--busy-soft);
    border-color: color-mix(in oklab, var(--busy) 30%, var(--border));
  }
  .gcb-sub {
    font-size: 11.5px;
    color: var(--text-3);
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }
  .gcb-sub .dot { width: 3px; height: 3px; border-radius: 50%; background: var(--text-4); }
  .gcb-sub .room-link {
    color: var(--accent);
    background: none;
    border: none;
    cursor: pointer;
    font: inherit;
    padding: 0;
    text-decoration: underline;
    text-underline-offset: 2px;
  }
  .gcb-sub .room-link:hover { color: var(--accent); filter: brightness(0.95); }
  .gcb-duration {
    font: 600 12px/1 var(--font-mono);
    color: var(--text);
    padding: 5px 8px;
    border-radius: var(--r-2);
    background: var(--surface-2);
    border: 1px solid var(--border);
    letter-spacing: 0.04em;
    font-variant-numeric: tabular-nums;
  }
  .global-call-bar[data-state="active"] .gcb-duration {
    color: var(--pos);
    background: color-mix(in oklab, var(--pos) 10%, transparent);
    border-color: color-mix(in oklab, var(--pos) 25%, var(--border));
  }
  .gcb-stack {
    display: inline-flex;
    margin-right: 4px;
  }
  .gcb-stack .gcb-av {
    width: 22px; height: 22px;
    border-radius: 50%;
    border: 2px solid var(--surface);
    margin-left: -8px;
    background: var(--surface-3);
    color: white;
    display: grid; place-items: center;
    font-size: 9px;
    font-weight: 600;
  }
  .gcb-stack .gcb-av:first-child { margin-left: 0; }
  .gcb-stack .gcb-av.agent {
    border-radius: 4px;
    background: var(--surface-3);
    color: var(--text);
    font-family: var(--font-mono);
    font-size: 8.5px;
    border: 2px solid var(--surface);
    box-shadow: 0 0 0 1px var(--border-2);
  }
  .gcb-actions { display: flex; gap: 6px; flex-shrink: 0; }
  .gcb-btn {
    height: 30px;
    padding: 0 10px;
    border-radius: var(--r-2);
    font-size: 12px;
    font-weight: 600;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .gcb-btn:hover { background: var(--surface-2); border-color: var(--border-2); }
  .gcb-btn.muted {
    background: var(--neg-soft);
    color: var(--neg);
    border-color: color-mix(in oklab, var(--neg) 40%, var(--border));
  }
  .gcb-btn.hang {
    background: var(--neg);
    color: white;
    border-color: var(--neg);
  }
  .gcb-btn.hang:hover { filter: brightness(0.95); background: var(--neg); }

  @media (max-width: 900px) {
    .global-call-bar { padding: 8px 12px; gap: 10px; }
    .gcb-stack { display: none; }
    .gcb-sub  { display: none; }
  }

  /* ============== Toast ============== */
  .cairn-toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--text);
    color: var(--bg);
    padding: 10px 14px;
    border-radius: var(--r-3);
    box-shadow: var(--shadow-3);
    font-size: 13px;
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 8px;
    z-index: 70;
    animation: toastIn 200ms cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  .cairn-toast svg { color: var(--pos); }
  @keyframes toastIn {
    from { opacity: 0; transform: translate(-50%, 8px); }
    to   { opacity: 1; transform: translate(-50%, 0);   }
  }

  /* ============== Audit Log modal ============== */
  .modal.al-modal {
    width: min(820px, 100%);
    max-height: min(86vh, 880px);
    display: flex;
    flex-direction: column;
  }
  .detail .m-head .lockup .icon-wrap.audit {
    background: color-mix(in oklab, var(--text-2) 10%, transparent);
    color: var(--text);
    border: 1px solid var(--border);
  }

  .al-av {
    border-radius: 50%;
    display: grid; place-items: center;
    font: 600 9px/1 var(--font-mono);
    color: #fff;
    letter-spacing: 0.02em;
    flex-shrink: 0;
  }
  .al-av.agent { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); }
  .al-av.sys   { background: var(--surface-2); color: var(--text-3); border: 1px solid var(--border); }

  /* Stats strip */
  .al-stats {
    display: flex;
    align-items: stretch;
    gap: 0;
    padding: 12px 22px;
    border-bottom: 1px solid var(--border);
    background: var(--surface-2);
  }
  .al-stat {
    display: flex; flex-direction: column;
    align-items: flex-start;
    justify-content: center;
    padding: 0 18px 0 0;
    min-width: 0;
  }
  .al-stat:first-child { padding-left: 0; }
  .al-stat-v {
    font: 600 18px/1 var(--font-sans);
    color: var(--text);
    letter-spacing: -0.01em;
    font-variant-numeric: tabular-nums;
  }
  .al-stat-k {
    font: 500 10px/1 var(--font-mono);
    color: var(--text-3);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-top: 4px;
  }
  .al-stat-div {
    width: 1px;
    background: var(--border);
    margin: 4px 18px 4px 0;
  }
  .al-stats .grow { flex: 1; }
  .al-verify {
    flex-direction: row;
    align-items: center;
    gap: 6px;
    padding: 6px 10px;
    border-radius: 999px;
    background: color-mix(in oklab, var(--pos) 8%, var(--surface));
    border: 1px solid color-mix(in oklab, var(--pos) 30%, var(--border));
    font: 600 10.5px/1 var(--font-mono);
    color: var(--pos);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    align-self: center;
  }
  .al-verify .al-pip {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--pos);
    box-shadow: 0 0 0 3px color-mix(in oklab, var(--pos) 20%, transparent);
  }

  /* Toolbar */
  .al-toolbar {
    padding: 12px 22px;
    border-bottom: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 10px;
    background: var(--surface);
  }
  .al-search {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 10px;
    height: 32px;
    border: 1px solid var(--border);
    border-radius: var(--r-2);
    background: var(--surface);
    color: var(--text-3);
  }
  .al-search:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .al-search input {
    border: none; outline: none; background: transparent;
    flex: 1; min-width: 0;
    font: 500 13px/1 var(--font-sans);
    color: var(--text);
  }
  .al-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .al-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 9px 5px 8px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: var(--surface);
    color: var(--text-2);
    font: 500 11.5px/1 var(--font-sans);
    cursor: pointer;
    transition: background 100ms;
  }
  .al-chip:hover { background: var(--surface-2); }
  .al-chip[data-active="true"] {
    background: var(--text);
    color: var(--bg);
    border-color: var(--text);
  }
  .al-chip[data-active="true"] .al-chip-c { color: var(--bg); opacity: 0.7; }
  .al-chip svg { opacity: 0.7; }
  .al-chip-c {
    font: 600 10px/1 var(--font-mono);
    color: var(--text-3);
    padding: 2px 4px;
    border-radius: 4px;
    background: color-mix(in oklab, var(--text-4) 14%, transparent);
    font-variant-numeric: tabular-nums;
  }

  /* List */
  .al-body { padding: 0 !important; overflow-y: auto; flex: 1; }
  .al-day { padding: 14px 22px 4px; }
  .al-day:not(:first-child) { border-top: 1px solid var(--border); margin-top: 4px; }
  .al-day-head {
    display: flex;
    align-items: center;
    gap: 8px;
    font: 600 10.5px/1 var(--font-mono);
    color: var(--text-3);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    padding-bottom: 10px;
  }
  .al-day-c {
    color: var(--text-4);
    padding: 2px 6px;
    background: var(--surface-2);
    border-radius: 999px;
    font-size: 10px;
  }
  .al-list {
    display: flex;
    flex-direction: column;
  }
  .al-row {
    display: grid;
    grid-template-columns: 24px 1fr;
    gap: 12px;
    position: relative;
  }
  .al-rail {
    position: relative;
    width: 24px;
  }
  .al-rail-line {
    position: absolute;
    left: 11px; top: 0; bottom: 0;
    width: 1px;
    background: var(--border);
  }
  .al-row[data-last="true"] .al-rail-line { bottom: 50%; }
  .al-row:first-child .al-rail-line { top: 50%; }
  .al-rail-dot {
    position: absolute;
    top: 16px; left: 5px;
    width: 14px; height: 14px;
    border-radius: 50%;
    color: #fff;
    display: grid; place-items: center;
    box-shadow: 0 0 0 3px var(--surface);
    z-index: 1;
  }
  .al-rail-dot svg { stroke: currentColor; }

  .al-row-body {
    padding: 6px 0 10px;
    min-width: 0;
  }
  .al-row-top {
    width: 100%;
    background: transparent;
    border: 1px solid transparent;
    border-radius: var(--r-2);
    padding: 6px 10px 6px 8px;
    display: grid;
    grid-template-columns: 44px 22px 1fr 14px;
    gap: 10px;
    align-items: center;
    text-align: left;
    cursor: pointer;
    color: var(--text);
  }
  .al-row-top:hover { background: var(--surface-2); border-color: var(--border); }
  .al-t {
    font: 500 11px/1 var(--font-mono);
    color: var(--text-3);
    letter-spacing: 0.02em;
    font-variant-numeric: tabular-nums;
  }
  .al-mid { min-width: 0; }
  .al-title {
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text);
    display: inline-flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }
  .al-tag {
    display: inline-flex;
    align-items: center;
    font: 600 9.5px/1 var(--font-mono);
    color: var(--text-3);
    background: var(--surface-2);
    border: 1px solid var(--border);
    padding: 2px 5px;
    border-radius: 4px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .al-tag.k-capability { color: var(--warn); border-color: color-mix(in oklab, var(--warn) 30%, var(--border)); background: color-mix(in oklab, var(--warn) 8%, var(--surface)); }
  .al-tag.k-call       { color: var(--pos);  border-color: color-mix(in oklab, var(--pos)  30%, var(--border)); background: color-mix(in oklab, var(--pos)  8%, var(--surface)); }
  .al-tag.k-poll       { color: var(--accent); border-color: color-mix(in oklab, var(--accent) 30%, var(--border)); background: color-mix(in oklab, var(--accent) 8%, var(--surface)); }
  .al-tag.k-task       { color: var(--pos);  border-color: color-mix(in oklab, var(--pos)  30%, var(--border)); background: color-mix(in oklab, var(--pos)  8%, var(--surface)); }
  .al-tag.k-member     { color: var(--text); }
  .al-tag.k-system     { color: var(--text-3); }
  .al-tag.k-message    { color: var(--text-3); }

  .al-signed {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font: 500 9.5px/1 var(--font-mono);
    color: var(--text-4);
    padding: 2px 5px;
    border-radius: 4px;
    background: color-mix(in oklab, var(--text-4) 8%, transparent);
  }
  .al-signed svg { opacity: 0.7; }

  .al-sum {
    margin-top: 4px;
    font-size: 12px;
    color: var(--text-2);
    line-height: 1.45;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .al-sum code, .al-summary code, .al-row-detail code {
    font: 500 11px/1.3 var(--font-mono);
    color: var(--text);
    padding: 1px 4px;
    background: var(--surface-2);
    border-radius: 3px;
    border: 1px solid var(--border);
  }

  .al-chev {
    color: var(--text-4);
    transition: transform 150ms;
    display: inline-block;
  }
  .al-chev.open { transform: rotate(180deg); color: var(--text-2); }

  .al-row-detail {
    margin: 4px 10px 4px 50px;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: var(--r-2);
    background: var(--surface-2);
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .al-meta-row {
    display: grid;
    grid-template-columns: 110px 1fr;
    gap: 12px;
    font-size: 12px;
    line-height: 1.4;
  }
  .al-meta-k {
    font: 500 10.5px/1.4 var(--font-mono);
    color: var(--text-3);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .al-meta-v { color: var(--text); word-break: break-word; }
  .al-meta-v.mono { font: 500 11.5px/1.4 var(--font-mono); color: var(--text-2); }
  .al-row-actions {
    display: flex;
    gap: 6px;
    margin-top: 4px;
  }

  /* Footer */
  .al-foot-note {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 11.5px;
    color: var(--text-3);
    max-width: 60%;
  }
  .al-foot-note svg { color: var(--text-4); }

  @media (max-width: 720px) {
    .al-stats { flex-wrap: wrap; gap: 8px 0; }
    .al-stat-div { display: none; }
    .al-stat { padding: 0 14px 0 0; }
    .al-verify { margin-top: 6px; }
    .al-row-detail { margin-left: 36px; }
    .al-meta-row { grid-template-columns: 1fr; gap: 2px; }
  }

  /* ============== Message actions: hover bar / reactions / reply / quote / edit ============== */
  .msg .msg-actions {
    position: absolute;
    top: -14px;
    right: 18px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-2);
    box-shadow: var(--shadow-2);
    display: none;
    align-items: center;
    padding: 2px;
    gap: 1px;
    z-index: 3;
  }
  @media (hover: hover) {
    .msg:hover > .msg-actions { display: inline-flex; }
  }
  .msg.actions-open > .msg-actions { display: inline-flex; }
  .msg .msg-actions .ma-btn {
    width: 28px; height: 28px;
    border: none; background: none;
    display: grid; place-items: center;
    border-radius: var(--r-1);
    color: var(--text-2);
    cursor: pointer;
  }
  .msg .msg-actions .ma-btn:hover { background: var(--surface-2); color: var(--text); }
  .msg .msg-actions .ma-btn.danger:hover { color: var(--neg); background: var(--neg-soft); }
  .msg .msg-actions .ma-sep {
    width: 1px; height: 16px; background: var(--border); margin: 0 2px;
  }

  /* reply-context link above message head */
  .msg .reply-context {
    display: grid;
    grid-template-columns: 22px 1fr;
    gap: 6px;
    font: inherit;
    font-size: 12px;
    color: var(--text-3);
    margin: 0 0 3px;
    padding: 0;
    cursor: pointer;
    align-items: center;
    min-width: 0;
    background: none;
    border: none;
    text-align: left;
    width: fit-content;
    max-width: 100%;
  }
  .msg .reply-context:hover .rc-body { color: var(--text); }
  .msg .reply-context:hover .rc-body .rc-who { color: var(--accent); }
  .msg .reply-context .rc-curve {
    width: 18px; height: 12px;
    border-left: 1.5px solid var(--border-2);
    border-top: 1.5px solid var(--border-2);
    border-top-left-radius: 7px;
    justify-self: end;
    align-self: end;
    margin-bottom: -2px;
  }
  .msg .reply-context .rc-body {
    display: flex;
    align-items: center;
    gap: 6px;
    min-width: 0;
    line-height: 1.2;
  }
  .msg .reply-context .rc-who {
    font-weight: 600;
    color: var(--text-2);
    white-space: nowrap;
  }
  .msg .reply-context .rc-text {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    min-width: 0;
    flex: 1;
  }
  .msg .reply-context .rc-text.deleted { font-style: italic; color: var(--text-4); }

  /* highlight when scrolled to */
  .msg.flash {
    animation: msgFlash 1.3s ease-out;
  }
  @keyframes msgFlash {
    0%   { background: color-mix(in oklab, var(--accent) 22%, transparent); }
    100% { background: transparent; }
  }

  /* embedded quote block inside a message */
  .msg .quote {
    border-left: 3px solid color-mix(in oklab, var(--accent) 60%, var(--border-2));
    padding: 4px 0 4px 10px;
    margin: 0 0 6px;
    color: var(--text-2);
    font-size: 13px;
    line-height: 1.45;
    background: linear-gradient(90deg, color-mix(in oklab, var(--accent) 6%, transparent), transparent 60%);
    border-radius: 0 var(--r-1) var(--r-1) 0;
  }
  .msg .quote .q-head {
    font: 500 11px/1.3 var(--font-mono);
    color: var(--text-3);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 3px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .msg .quote .q-head .q-who { color: var(--text); text-transform: none; font: 600 12px/1 var(--font-sans); letter-spacing: 0; }
  .msg .quote .q-text {
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
    text-wrap: pretty;
  }

  /* reactions row */
  .msg .reactions {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-top: 6px;
  }
  .msg .reactions .reaction {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 0 8px;
    height: 24px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 999px;
    font-size: 13px;
    cursor: pointer;
    color: var(--text-2);
    font-variant-numeric: tabular-nums;
    transition: transform 90ms ease, background 90ms;
  }
  .msg .reactions .reaction:hover {
    border-color: var(--border-2);
    background: var(--surface-3);
    color: var(--text);
  }
  .msg .reactions .reaction:active { transform: scale(0.94); }
  .msg .reactions .reaction .rx-e { font-size: 14px; line-height: 1; }
  .msg .reactions .reaction .rx-c { font: 600 11px/1 var(--font-mono); color: var(--text-2); }
  .msg .reactions .reaction.mine {
    background: var(--accent-soft);
    color: var(--accent);
    border-color: color-mix(in oklab, var(--accent) 35%, var(--border));
  }
  .msg .reactions .reaction.mine .rx-c { color: var(--accent); }
  .msg .reactions .reaction.add {
    color: var(--text-3);
    padding: 0 7px;
    background: transparent;
    border-style: dashed;
  }
  .msg .reactions .reaction.add:hover { color: var(--text); background: var(--surface-2); border-style: solid; }

  /* edited marker */
  .msg .head .edited {
    font: 500 11px/1 var(--font-sans);
    color: var(--text-3);
    font-style: italic;
  }

  /* edit form */
  .msg .edit-form {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-top: 2px;
  }
  .msg .edit-form textarea {
    width: 100%;
    min-height: 38px;
    max-height: 220px;
    padding: 8px 10px;
    border: 1px solid var(--accent);
    border-radius: var(--r-2);
    background: var(--surface);
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    line-height: 1.5;
    outline: none;
    resize: none;
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  .msg .edit-form .ef-actions {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    color: var(--text-3);
  }
  .msg .edit-form .ef-actions .grow { flex: 1; }
  .msg .edit-form .ef-hint {
    font: 500 11px/1 var(--font-mono);
    color: var(--text-3);
  }
  .msg .edit-form .ef-hint kbd {
    font: inherit;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 1px 4px;
    color: var(--text-2);
  }

  /* deleted-message placeholder */
  .msg.deleted .text {
    color: var(--text-3);
    font-style: italic;
    font-size: 13px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .msg.deleted .text svg { color: var(--text-4); }

  /* composer reply / quote chip */
  .composer-context {
    display: grid;
    grid-template-columns: auto auto 1fr auto;
    gap: 10px;
    align-items: center;
    padding: 8px 12px;
    margin-bottom: 8px;
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    border-radius: var(--r-2);
    background: var(--surface-2);
    font-size: 12.5px;
    color: var(--text-2);
    box-shadow: var(--shadow-1);
  }
  .composer-context .cc-mode {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font: 600 10px/1 var(--font-mono);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--accent);
    white-space: nowrap;
  }
  .composer-context .cc-who { font-weight: 600; color: var(--text); }
  .composer-context .cc-text {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    min-width: 0;
    color: var(--text-2);
  }
  .composer-context .cc-text.deleted { font-style: italic; color: var(--text-4); }
  .composer-context .cc-close {
    width: 22px; height: 22px;
    border: none;
    background: none;
    color: var(--text-3);
    border-radius: var(--r-1);
    cursor: pointer;
    display: grid; place-items: center;
    flex-shrink: 0;
  }
  .composer-context .cc-close:hover { background: var(--surface-3); color: var(--text); }

  /* quick reaction strip inside kebab/quick popover */
  .rx-pop .quick-react {
    display: flex;
    gap: 2px;
    padding: 6px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }
  .rx-pop .quick-react .qr-btn {
    width: 30px; height: 30px;
    display: grid; place-items: center;
    border: none;
    background: none;
    font-size: 18px;
    border-radius: var(--r-1);
    cursor: pointer;
    line-height: 1;
    transition: transform 90ms;
  }
  .rx-pop .quick-react .qr-btn:hover { background: var(--surface-2); transform: scale(1.15); }
  .rx-pop .quick-react .qr-btn.more {
    font-size: 13px;
    color: var(--text-3);
  }
  .rx-pop .quick-react .qr-btn.more:hover { color: var(--text); transform: none; }

  /* ============== Create-Space / Create-Channel modal ============== */
  .modal.cc-modal {
    width: min(540px, 100%);
  }
  .modal.cc-modal-channel {
    width: min(620px, 100%);
  }
  .cc-modal .m-body {
    padding: 14px 22px 18px;
    max-height: 70vh;
    overflow-y: auto;
    gap: 14px;
    display: flex;
    flex-direction: column;
  }
  .cc-modal .m-head {
    padding: 16px 22px 14px;
    border-bottom: 1px solid var(--border);
  }
  .cc-modal .m-head h2 {
    font-size: 16px;
    letter-spacing: -0.01em;
  }
