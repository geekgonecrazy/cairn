<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Cairn — Messaging</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

<style id="cairn-tokens">
  :root {
    /* type */
    --font-sans: "Plus Jakarta Sans", ui-sans-serif, system-ui, -apple-system, sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;

    /* radii */
    --r-1: 4px;  --r-2: 6px;  --r-3: 8px;  --r-4: 10px;  --r-5: 14px;

    /* spacing scale */
    --s-1: 4px; --s-2: 6px; --s-3: 8px; --s-4: 10px; --s-5: 12px;
    --s-6: 14px; --s-7: 16px; --s-8: 20px; --s-9: 24px; --s-10: 32px;

    /* light tokens */
    --bg:       oklch(0.985 0.002 250);
    --surface:  oklch(1 0 0);
    --surface-2:oklch(0.965 0.003 250);
    --surface-3:oklch(0.945 0.004 250);
    --border:   oklch(0.91 0.005 250);
    --border-2: oklch(0.86 0.006 250);
    --text:     oklch(0.22 0.012 260);
    --text-2:   oklch(0.48 0.012 260);
    --text-3:   oklch(0.62 0.010 260);
    --text-4:   oklch(0.74 0.008 260);

    --accent:        oklch(0.56 0.14 255);
    --accent-fg:     oklch(0.985 0.005 255);
    --accent-soft:   oklch(0.94 0.03 255);
    --accent-soft-2: oklch(0.88 0.06 255);

    --pos:      oklch(0.58 0.12 150);
    --pos-soft: oklch(0.94 0.04 150);
    --neg:      oklch(0.58 0.16 25);
    --neg-soft: oklch(0.95 0.04 25);
    --busy:     oklch(0.68 0.13 75);
    --busy-soft:oklch(0.95 0.05 75);
    --warn:     oklch(0.65 0.14 60);

    --shadow-1: 0 1px 2px -1px oklch(0.2 0.02 260 / 0.08), 0 1px 1px oklch(0.2 0.02 260 / 0.05);
    --shadow-2: 0 4px 12px -4px oklch(0.2 0.02 260 / 0.12), 0 2px 6px oklch(0.2 0.02 260 / 0.06);
    --shadow-3: 0 24px 48px -16px oklch(0.18 0.02 260 / 0.22), 0 8px 20px -6px oklch(0.18 0.02 260 / 0.12);

    --cross-tint: oklch(0.72 0.12 35); /* amber-ish chrome for cross-household rooms */
  }

  html[data-theme="dark"] {
    --bg:       oklch(0.155 0.008 260);
    --surface:  oklch(0.185 0.008 260);
    --surface-2:oklch(0.215 0.008 260);
    --surface-3:oklch(0.255 0.008 260);
    --border:   oklch(0.295 0.008 260);
    --border-2: oklch(0.355 0.010 260);
    --text:     oklch(0.96 0.004 260);
    --text-2:   oklch(0.74 0.008 260);
    --text-3:   oklch(0.58 0.010 260);
    --text-4:   oklch(0.46 0.010 260);

    --accent:        oklch(0.74 0.13 255);
    --accent-fg:     oklch(0.16 0.02 255);
    --accent-soft:   oklch(0.30 0.06 255);
    --accent-soft-2: oklch(0.40 0.10 255);

    --pos:      oklch(0.74 0.14 152);
    --pos-soft: oklch(0.30 0.06 150);
    --neg:      oklch(0.72 0.16 25);
    --neg-soft: oklch(0.30 0.06 25);
    --busy:     oklch(0.80 0.14 75);
    --busy-soft:oklch(0.32 0.07 75);
    --warn:     oklch(0.78 0.15 60);

    --shadow-1: 0 1px 2px -1px oklch(0 0 0 / 0.5);
    --shadow-2: 0 6px 16px -6px oklch(0 0 0 / 0.5), 0 2px 6px oklch(0 0 0 / 0.3);
    --shadow-3: 0 24px 48px -16px oklch(0 0 0 / 0.6), 0 8px 20px -6px oklch(0 0 0 / 0.4);

    --cross-tint: oklch(0.78 0.13 50);
  }

  * { box-sizing: border-box; }
  html, body, #root { height: 100%; }
  body {
    margin: 0;
    font-family: var(--font-sans);
    font-size: 14px;
    line-height: 1.45;
    color: var(--text);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    font-feature-settings: "ss01", "cv11";
    overflow: hidden;
  }
  button { font-family: inherit; }
  input, textarea, select { font-family: inherit; color: inherit; }
  ::selection { background: var(--accent-soft-2); color: var(--text); }

  /* scrollbar */
  *::-webkit-scrollbar { width: 10px; height: 10px; }
  *::-webkit-scrollbar-thumb { background: var(--border-2); border-radius: 6px; border: 2px solid transparent; background-clip: content-box; }
  *::-webkit-scrollbar-thumb:hover { background: var(--text-4); background-clip: content-box; border: 2px solid transparent; }
  *::-webkit-scrollbar-track { background: transparent; }
</style>

<style id="cairn-app-css">
  /* ---------- shell ---------- */
  .shell {
    display: grid;
    grid-template-columns: 56px 280px 1fr;
    height: 100vh;
    width: 100vw;
    background: var(--bg);
  }
  /* Sidebar panel: shell grows a 4th column for the panel as a sibling of .room */
  .shell[data-panel="sidebar"][data-has-panel="true"] {
    grid-template-columns: 56px 280px 1fr 340px;
  }

  @media (max-width: 900px) {
    .shell, .shell[data-panel="sidebar"][data-has-panel="true"] {
      grid-template-columns: 1fr;
    }
    .shell .space-rail, .shell .room-list, .shell > .room-panel { display: none; }
    .shell[data-mobile-view="rooms"]               { grid-template-columns: 56px 1fr !important; }
    .shell[data-mobile-view="rooms"] .space-rail   { display: flex; grid-column: 1; }
    .shell[data-mobile-view="rooms"] .room-list    { display: flex; grid-column: 2; }
    .shell[data-mobile-view="rooms"] .room         { display: none; }
    .shell[data-mobile-view="room"]  .room         { grid-column: 1 / -1; }
  }

  /* ---------- space rail ---------- */
  .space-rail {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 14px 0 12px;
    gap: 10px;
    background: var(--surface-2);
    border-right: 1px solid var(--border);
    height: 100%;
  }
  .space-rail .logo {
    width: 30px; height: 30px;
    display: grid; place-items: center;
    margin-bottom: 8px;
  }
  .space-rail .logo svg { display: block; }
  .space-rail .space {
    width: 36px; height: 36px;
    border-radius: var(--r-3);
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-2);
    display: grid;
    place-items: center;
    cursor: pointer;
    font-weight: 600;
    font-size: 12px;
    letter-spacing: 0.02em;
    position: relative;
    transition: background 80ms, color 80ms, border-color 80ms;
  }
  .space-rail .space:hover { color: var(--text); border-color: var(--border-2); }
  .space-rail .space[aria-current="true"] {
    background: var(--text);
    color: var(--bg);
    border-color: var(--text);
  }
  .space-rail .space[aria-current="true"]::before {
    content: "";
    position: absolute;
    left: -10px; top: 50%;
    transform: translateY(-50%);
    width: 3px; height: 18px;
    background: var(--accent);
    border-radius: 2px;
  }
  .space-rail .space .dot {
    position: absolute;
    top: -3px; right: -3px;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--accent);
    border: 2px solid var(--surface-2);
  }
  .space-rail .grow { flex: 1; }
  .space-rail .me {
    width: 32px; height: 32px;
    border-radius: 50%;
    background: linear-gradient(135deg, oklch(0.62 0.10 35), oklch(0.55 0.13 25));
    color: white;
    display: grid; place-items: center;
    font-weight: 600;
    font-size: 12px;
    border: 1px solid var(--border-2);
    cursor: pointer;
  }

  /* ---------- room list ---------- */
  .room-list {
    display: flex;
    flex-direction: column;
    background: var(--surface-2);
    border-right: 1px solid var(--border);
    height: 100%;
    min-width: 0;
  }
  .room-list .head {
    padding: 18px 18px 12px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
  }
  .room-list .head h2 {
    margin: 0;
    font-size: 18px;
    letter-spacing: -0.01em;
    font-weight: 600;
  }
  .room-list .head .meta {
    font: 500 11px/1 var(--font-mono);
    color: var(--text-3);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .room-list .search {
    margin: 0 12px 8px;
    position: relative;
  }
  .room-list .search input {
    width: 100%;
    padding: 8px 10px 8px 30px;
    border: 1px solid var(--border);
    background: var(--surface);
    border-radius: var(--r-2);
    font-size: 13px;
    outline: none;
  }
  .room-list .search input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .room-list .search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--text-3); }

  .room-list .section-label {
    padding: 14px 18px 6px;
    font: 600 11px/1 var(--font-sans);
    color: var(--text-3);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .room-list .section-label .count { font-family: var(--font-mono); font-weight: 500; color: var(--text-4); }
  .room-list .rooms { overflow-y: auto; padding: 0 8px 16px; flex: 1; min-height: 0; }

  .room-item {
    display: grid;
    grid-template-columns: 18px 1fr auto;
    gap: 10px;
    align-items: center;
    padding: 8px 10px;
    border-radius: var(--r-2);
    cursor: pointer;
    border: 1px solid transparent;
    color: var(--text-2);
    margin-bottom: 1px;
  }
  .room-item:hover { background: var(--surface-3); color: var(--text); }
  .room-item[aria-current="true"] {
    background: var(--surface);
    color: var(--text);
    border-color: var(--border);
    box-shadow: var(--shadow-1);
  }
  .room-item .glyph {
    color: var(--text-3);
    font-family: var(--font-mono);
    font-size: 13px;
    text-align: center;
    line-height: 1;
  }
  .room-item .name {
    font-size: 13.5px;
    font-weight: 500;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .room-item[aria-current="true"] .name { font-weight: 600; }
  .room-item .badge {
    font: 500 10px/1 var(--font-mono);
    color: var(--text);
    background: var(--surface-3);
    border: 1px solid var(--border-2);
    border-radius: 999px;
    padding: 2px 6px;
    min-width: 16px;
    text-align: center;
  }
  .room-item .badge.accent { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  .room-item .name .xh-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--cross-tint);
    flex-shrink: 0;
  }
  .room-item .name .agent-dot {
    width: 6px; height: 6px; border-radius: 1px;
    background: var(--accent);
    transform: rotate(45deg);
    flex-shrink: 0;
  }

  .room-list .footer {
    border-top: 1px solid var(--border);
    padding: 10px 14px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--text-2);
  }
  .room-list .footer .status-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--pos);
    box-shadow: 0 0 0 3px var(--pos-soft);
  }
  .room-list .footer .mode {
    margin-left: auto;
    font: 500 11px/1 var(--font-mono);
    color: var(--text-2);
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 4px 8px;
    border-radius: var(--r-2);
    cursor: pointer;
    letter-spacing: 0.04em;
  }
  .room-list .footer .mode:hover { color: var(--text); border-color: var(--border-2); }

  /* ---------- room (active) ---------- */
  .room {
    display: flex;
    flex-direction: column;
    height: 100%;
    min-width: 0;
    min-height: 0;
    background: var(--surface);
    position: relative;
    overflow: hidden;
  }
  .room > .room-body { flex: 1 1 auto; min-height: 0; }
  .room > .room-header,
  .room > .xh-banner,
  .room > .global-call-bar,
  .room > .composer-wrap { flex: 0 0 auto; }

  /* sidebar panel lives as a sibling of .room inside .shell */
  .shell > .room-panel { border-left: 1px solid var(--border); height: 100%; }
  /* header-strip variant: panel is rendered INSIDE .room above the body */
  .room > .room-panel { border-bottom: 1px solid var(--border); flex: 0 0 auto; }

  .room-header {
    padding: 14px 24px 14px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 14px;
    background: var(--surface);
    min-height: 60px;
  }
  .room-header .back {
    display: none;
    background: none; border: none; padding: 6px; margin: -6px 0 -6px -6px;
    color: var(--text-2); cursor: pointer; border-radius: var(--r-2);
  }
  .room-header .back:hover { background: var(--surface-2); color: var(--text); }
  @media (max-width: 900px) { .room-header .back { display: inline-flex; } }
  .room-header .title {
    display: flex; flex-direction: column; gap: 2px; min-width: 0;
  }
  .room-header .title h1 {
    margin: 0;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: -0.01em;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .room-header .title h1 .room-glyph {
    color: var(--text-3); font-family: var(--font-mono); font-weight: 500;
  }
  .room-header .title .sub {
    font-size: 12px;
    color: var(--text-3);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .room-header .title .sub .dot { width: 3px; height: 3px; border-radius: 50%; background: var(--text-4); }
  .room-header .actions {
    margin-left: auto;
    display: flex;
    gap: 4px;
  }
  .room-header .actions .icon-btn {
    width: 32px; height: 32px;
    display: grid; place-items: center;
    background: none; border: 1px solid transparent;
    color: var(--text-2);
    border-radius: var(--r-2);
    cursor: pointer;
  }
  .room-header .actions .icon-btn:hover { background: var(--surface-2); color: var(--text); border-color: var(--border); }

  /* cross-household marking */
  .room.xh .room-header {
    box-shadow: inset 0 -1px 0 var(--border), inset 0 4px 0 var(--cross-tint);
  }
  .room.xh .xh-banner {
    background: color-mix(in oklab, var(--cross-tint) 12%, transparent);
    border-bottom: 1px solid color-mix(in oklab, var(--cross-tint) 35%, var(--border));
    padding: 8px 24px;
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 12px;
    color: var(--text);
  }
  .room.xh .xh-banner svg { color: var(--cross-tint); flex-shrink: 0; }

  /* room body */
  .room-body {
    overflow-y: auto;
    padding: 16px 0 8px;
    min-height: 0;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  /* ---------- message ---------- */
  .day-divider {
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--text-3);
    font: 500 11px/1 var(--font-mono);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    padding: 14px 24px 8px;
  }
  .day-divider::before, .day-divider::after {
    content: ""; flex: 1; height: 1px; background: var(--border);
  }

  .msg {
    display: grid;
    grid-template-columns: 36px 1fr;
    gap: 10px;
    padding: 6px 24px;
    position: relative;
  }
  .msg.dense { padding-top: 1px; padding-bottom: 1px; }
  .msg:hover { background: color-mix(in oklab, var(--surface-2) 60%, transparent); }
  .msg .avatar {
    width: 32px; height: 32px;
    border-radius: 50%;
    display: grid; place-items: center;
    font-weight: 600;
    font-size: 12px;
    color: var(--surface);
    letter-spacing: -0.01em;
    align-self: start;
    margin-top: 2px;
  }
  .msg .avatar.agent {
    border-radius: var(--r-2);
    background: var(--surface-3);
    color: var(--text);
    border: 1px solid var(--border-2);
    font-family: var(--font-mono);
    font-size: 11px;
  }
  .msg.dense .avatar { visibility: hidden; height: 0; margin: 0; }
  .msg .body { min-width: 0; }
  .msg .head {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 1px;
  }
  .msg .head .author { font-weight: 600; font-size: 13.5px; color: var(--text); letter-spacing: -0.005em; }
  .msg .head .time { font: 500 11px/1 var(--font-mono); color: var(--text-3); }
  .msg .head .origin {
    font-size: 11px;
    color: var(--text-3);
  }
  .msg .text {
    font-size: 14px;
    line-height: 1.5;
    color: var(--text);
    word-wrap: break-word;
    text-wrap: pretty;
  }
  .msg .state {
    margin-top: 3px;
    font: 500 10.5px/1 var(--font-mono);
    color: var(--text-3);
    text-transform: lowercase;
    letter-spacing: 0.04em;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .msg .state .ico { display: inline-block; width: 10px; height: 10px; }
  .msg.mine .author { color: var(--accent); }

  /* agent badge — option 4: name + AGT pill */
  .agent-tag {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .agent-tag .pill {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font: 600 9.5px/1 var(--font-mono);
    letter-spacing: 0.08em;
    color: var(--text);
    border: 1px solid var(--text-2);
    padding: 2px 5px 2px 5px;
    border-radius: 3px;
    text-transform: uppercase;
    background: transparent;
    position: relative;
    top: -1px;
  }
  .agent-tag .pill::before {
    content: "";
    width: 4px; height: 4px;
    background: var(--accent);
    border-radius: 1px;
    transform: rotate(45deg);
    display: inline-block;
  }
  .agent-tag .op {
    font-size: 11.5px;
    color: var(--text-3);
    font-weight: 400;
  }

  /* ---------- composer ---------- */
  .composer-wrap {
    padding: 10px 18px 16px;
    background: var(--surface);
    border-top: 1px solid var(--border);
  }
  .composer {
    border: 1px solid var(--border);
    border-radius: var(--r-3);
    background: var(--surface);
    padding: 8px 8px 6px;
    transition: border-color 100ms;
    box-shadow: var(--shadow-1);
  }
  .composer:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .composer textarea {
    width: 100%;
    border: none; outline: none; resize: none;
    background: transparent;
    font-size: 14px;
    line-height: 1.5;
    padding: 6px 8px;
    color: var(--text);
    max-height: 160px;
    min-height: 22px;
  }
  .composer textarea::placeholder { color: var(--text-3); }
  .composer .row {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 2px 4px 0;
  }
  .composer .row .icon-btn {
    width: 28px; height: 28px;
    display: grid; place-items: center;
    border: none; background: none;
    color: var(--text-3);
    border-radius: var(--r-2);
    cursor: pointer;
  }
  .composer .row .icon-btn:hover { background: var(--surface-2); color: var(--text); }
  .composer .row .spacer { flex: 1; }
  .composer .row .hint {
    font: 500 11px/1 var(--font-mono);
    color: var(--text-3);
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 8px;
    border: 1px solid var(--border);
    border-radius: var(--r-2);
    background: var(--surface-2);
    cursor: pointer;
  }
  .composer .row .hint:hover { color: var(--text); border-color: var(--border-2); }
  .composer .row .hint .hint-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--text-3); }
  .composer .row .hint.via-mesh .hint-dot { background: var(--busy); }

  .composer .row .send {
    height: 28px;
    padding: 0 12px;
    background: var(--accent);
    color: var(--accent-fg);
    border: 1px solid var(--accent);
    border-radius: var(--r-2);
    font-weight: 600;
    font-size: 12.5px;
    letter-spacing: 0.01em;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .composer .row .send[disabled] {
    background: var(--surface-3);
    color: var(--text-3);
    border-color: var(--border);
    cursor: not-allowed;
  }
  .composer .row .send:not([disabled]):hover {
    filter: brightness(1.05);
  }

  /* slash menu */
  .slash-menu {
    position: absolute;
    bottom: 100%;
    left: 0;
    margin-bottom: 6px;
    width: 320px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-3);
    box-shadow: var(--shadow-3);
    padding: 6px;
    z-index: 20;
    overflow: hidden;
  }
  .slash-menu .h {
    font: 600 10px/1 var(--font-mono);
    color: var(--text-3);
    padding: 8px 8px 6px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  .slash-menu .opt {
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: center;
    gap: 10px;
    padding: 7px 8px;
    border-radius: var(--r-2);
    cursor: pointer;
  }
  .slash-menu .opt[aria-selected="true"] { background: var(--surface-2); }
  .slash-menu .opt .cmd { font: 600 12.5px/1 var(--font-mono); color: var(--accent); }
  .slash-menu .opt .desc { font-size: 12px; color: var(--text-2); }
  .slash-menu .opt .ret { font: 500 10px/1 var(--font-mono); color: var(--text-3); }

  /* ---------- inlay generic ---------- */
  .inlay {
    border: 1px solid var(--border);
    background: var(--surface);
    border-radius: var(--r-4);
    margin: 6px 0 10px;
    overflow: hidden;
    box-shadow: var(--shadow-1);
  }
  .inlay .head {
    padding: 12px 14px 8px;
    display: flex;
    align-items: flex-start;
    gap: 10px;
  }
  .inlay .head .icon {
    width: 24px; height: 24px;
    border-radius: var(--r-2);
    background: var(--surface-2);
    display: grid; place-items: center;
    color: var(--text-2);
    flex-shrink: 0;
    margin-top: 1px;
  }
  .inlay .head .title-block { flex: 1; min-width: 0; }
  .inlay .head .title {
    font-weight: 600;
    font-size: 13.5px;
    color: var(--text);
    letter-spacing: -0.005em;
  }
  .inlay .head .sub {
    font-size: 12px;
    color: var(--text-3);
    margin-top: 1px;
  }
  .inlay .meta-line {
    padding: 0 14px 12px;
    font: 500 11px/1.3 var(--font-mono);
    color: var(--text-3);
    letter-spacing: 0.02em;
  }
  .inlay .actions {
    padding: 0 12px 12px;
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .btn {
    height: 30px;
    padding: 0 12px;
    border-radius: var(--r-2);
    font-size: 12.5px;
    font-weight: 600;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    letter-spacing: 0.005em;
  }
  .btn:hover { background: var(--surface-2); border-color: var(--border-2); }
  .btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  .btn.primary:hover { filter: brightness(1.05); background: var(--accent); }
  .btn.danger { color: var(--neg); border-color: color-mix(in oklab, var(--neg) 40%, var(--border)); }
  .btn.danger:hover { background: var(--neg-soft); border-color: var(--neg); }
  .btn.ghost { border-color: transparent; background: transparent; color: var(--text-2); }
  .btn.ghost:hover { background: var(--surface-2); color: var(--text); }
  .btn.sm { height: 26px; padding: 0 10px; font-size: 12px; }

  /* poll */
  .poll-opt {
    display: grid;
    grid-template-columns: 18px 1fr auto;
    gap: 10px;
    align-items: center;
    padding: 9px 14px;
    cursor: pointer;
    position: relative;
    border-top: 1px solid var(--border);
    isolation: isolate;
  }
  .poll-opt:hover { background: var(--surface-2); }
  .poll-opt .bar-fill {
    position: absolute;
    left: 0; top: 4px; bottom: 4px;
    background: color-mix(in oklab, var(--accent) 12%, transparent);
    border-radius: 0 var(--r-1) var(--r-1) 0;
    transition: width 350ms cubic-bezier(0.2, 0.7, 0.2, 1);
    z-index: -1;
    pointer-events: none;
  }
  .poll-opt[data-selected="true"] .bar-fill {
    background: color-mix(in oklab, var(--accent) 22%, transparent);
  }
  .poll-opt .radio {
    width: 14px; height: 14px;
    border-radius: 50%;
    border: 1.5px solid var(--border-2);
    display: grid; place-items: center;
    background: var(--surface);
  }
  .poll-opt[data-selected="true"] .radio {
    border-color: var(--accent);
    background: var(--accent);
  }
  .poll-opt[data-selected="true"] .radio::after {
    content: ""; width: 4px; height: 4px; border-radius: 50%; background: var(--accent-fg);
  }
  .poll-opt .label {
    font-size: 13px;
    color: var(--text);
    min-width: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .poll-opt .pct {
    font: 600 12px/1 var(--font-mono);
    color: var(--text-2);
    min-width: 36px;
    text-align: right;
  }
  .poll-opt[data-selected="true"] .pct { color: var(--accent); }

  /* approval */
  .approval {
    border-color: color-mix(in oklab, var(--warn) 45%, var(--border));
  }
  .approval .head .icon {
    background: color-mix(in oklab, var(--warn) 18%, transparent);
    color: var(--warn);
  }
  .capability-row {
    margin: 0 14px;
    border: 1px solid var(--border);
    background: var(--surface-2);
    border-radius: var(--r-2);
    padding: 10px 12px;
    display: grid;
    grid-template-columns: max-content 1fr;
    gap: 6px 14px;
    font-size: 12.5px;
  }
  .capability-row .k {
    color: var(--text-3);
    font: 500 11px/1.4 var(--font-mono);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .capability-row .v { font-family: var(--font-mono); font-weight: 500; color: var(--text); word-break: break-all; }
  .capability-row .v.scope { font-family: var(--font-sans); font-weight: 400; color: var(--text-2); }
  .approval .disclosure {
    margin: 10px 14px 0;
    display: flex;
    gap: 8px;
    align-items: center;
    font-size: 11.5px;
    color: var(--warn);
    padding: 8px 10px;
    background: color-mix(in oklab, var(--warn) 10%, transparent);
    border-radius: var(--r-2);
    border: 1px dashed color-mix(in oklab, var(--warn) 50%, var(--border));
  }
  .approval[data-state="approved"] {
    border-color: color-mix(in oklab, var(--pos) 45%, var(--border));
    background: color-mix(in oklab, var(--pos) 6%, var(--surface));
  }
  .approval[data-state="approved"] .head .icon {
    background: color-mix(in oklab, var(--pos) 18%, transparent);
    color: var(--pos);
  }
  .approval[data-state="denied"] .head .icon {
    background: color-mix(in oklab, var(--neg) 18%, transparent);
    color: var(--neg);
  }

  /* task complete card */
  .task-card .head .icon {
    background: var(--pos-soft); color: var(--pos);
  }
  .task-card .head {
    padding-bottom: 12px;
  }

  /* ---------- room panel ---------- */
  .room-panel {
    background: var(--surface-2);
    overflow-y: auto;
    min-height: 0;
    padding: 14px 14px 18px;
  }
  .shell[data-panel="header"] .room-panel {
    padding: 12px 24px 12px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }
  .panel-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-4);
    overflow: hidden;
    box-shadow: var(--shadow-1);
  }
  .shell[data-panel="header"] .panel-card {
    background: var(--surface-2);
  }
  .panel-card .panel-head {
    padding: 14px 14px 12px;
    display: flex;
    align-items: flex-start;
    gap: 10px;
    border-bottom: 1px solid var(--border);
  }
  .panel-card .panel-head.as-button {
    width: 100%;
    background: none;
    border: none;
    border-bottom: 1px solid var(--border);
    text-align: left;
    color: inherit;
    cursor: pointer;
    align-items: center;
  }
  .panel-card .panel-head.as-button:hover { background: var(--surface-2); }
  .shell[data-panel="header"] .panel-card .panel-head.as-button:hover { background: var(--surface); }
  .panel-card[data-collapsed="true"] .panel-head.as-button { border-bottom-color: transparent; }
  .panel-chevron {
    width: 24px; height: 24px;
    display: grid; place-items: center;
    color: var(--text-3);
    border-radius: var(--r-2);
    transition: transform 160ms ease, background 80ms;
    flex-shrink: 0;
  }
  .panel-card[data-collapsed="true"] .panel-chevron { transform: rotate(-90deg); }
  .panel-head.as-button:hover .panel-chevron { color: var(--text); background: var(--surface); }
  .shell[data-panel="header"] .panel-head.as-button:hover .panel-chevron { background: var(--surface-2); }
  .shell[data-panel="header"] .panel-card .panel-head {
    border-bottom: none;
    padding-bottom: 10px;
  }
  .panel-card .panel-head .ico {
    width: 28px; height: 28px;
    border-radius: var(--r-2);
    background: var(--surface-2);
    border: 1px solid var(--border-2);
    display: grid; place-items: center;
    color: var(--text);
    font-family: var(--font-mono);
    font-size: 12px;
    font-weight: 600;
    flex-shrink: 0;
  }
  .shell[data-panel="header"] .panel-card .panel-head .ico { background: var(--surface); }
  .panel-card .panel-head .title-block { flex: 1; min-width: 0; }
  .panel-card .panel-head .title {
    font-size: 14px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .panel-card .panel-head .sub {
    font-size: 12px;
    color: var(--text-3);
    margin-top: 2px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .status-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font: 500 11px/1 var(--font-mono);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    padding: 3px 7px 3px 6px;
    border-radius: var(--r-1);
    border: 1px solid var(--border-2);
    background: var(--surface-2);
    color: var(--text-2);
  }
  .status-chip .swatch {
    width: 6px; height: 6px; border-radius: 50%; background: var(--text-3);
  }
  .status-chip[data-polarity="positive"] { color: var(--pos); border-color: color-mix(in oklab, var(--pos) 35%, var(--border)); background: var(--pos-soft); }
  .status-chip[data-polarity="positive"] .swatch { background: var(--pos); }
  .status-chip[data-polarity="negative"] { color: var(--neg); border-color: color-mix(in oklab, var(--neg) 40%, var(--border)); background: var(--neg-soft); }
  .status-chip[data-polarity="negative"] .swatch { background: var(--neg); }
  .status-chip[data-polarity="busy"]     { color: var(--busy); border-color: color-mix(in oklab, var(--busy) 40%, var(--border)); background: var(--busy-soft); }
  .status-chip[data-polarity="busy"] .swatch { background: var(--busy); animation: pulseDot 1.6s ease-in-out infinite; }
  @keyframes pulseDot { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

  .panel-stats {
    padding: 10px 14px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    border-bottom: 1px solid var(--border);
  }
  .shell[data-panel="header"] .panel-stats { border-bottom: none; padding-top: 4px; padding-bottom: 6px; }
  .panel-stat .k {
    font: 500 10px/1 var(--font-mono);
    color: var(--text-3);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 4px;
  }
  .panel-stat .v {
    font-size: 16px;
    font-weight: 600;
    letter-spacing: -0.01em;
    color: var(--text);
    display: flex;
    align-items: baseline;
    gap: 4px;
  }
  .panel-stat .v small {
    font-size: 11px; font-weight: 500; color: var(--text-3); font-family: var(--font-mono);
  }

  .panel-tasks {
    padding: 8px 4px 6px;
  }
  .shell[data-panel="header"] .panel-tasks { display: none; }
  .panel-section-label {
    padding: 8px 10px 4px;
    font: 600 10px/1 var(--font-mono);
    color: var(--text-3);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .task-row {
    display: grid;
    grid-template-columns: 14px 1fr auto;
    gap: 10px;
    align-items: center;
    padding: 8px 10px;
    border-radius: var(--r-2);
    cursor: default;
  }
  .task-row:hover { background: var(--surface-2); }
  .task-row .glyph {
    color: var(--text-3);
    font-family: var(--font-mono);
    font-size: 11px;
    text-align: center;
  }
  .task-row .glyph.running { color: var(--busy); }
  .task-row .glyph.done    { color: var(--pos); }
  .task-row .glyph.failed  { color: var(--neg); }
  .task-row .t {
    min-width: 0;
    overflow: hidden;
  }
  .task-row .t .name {
    font-size: 13px;
    color: var(--text);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .task-row .t .bar {
    margin-top: 5px;
    height: 4px;
    background: var(--surface-3);
    border-radius: 999px;
    overflow: hidden;
    position: relative;
  }
  .task-row .t .bar-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 999px;
    transition: width 600ms cubic-bezier(0.2, 0.7, 0.2, 1);
  }
  .task-row.running .t .bar-fill {
    background: linear-gradient(90deg, var(--busy), color-mix(in oklab, var(--busy) 65%, var(--accent)));
  }
  .task-row.done .t .bar-fill { background: var(--pos); }
  .task-row .pct {
    font: 600 11px/1 var(--font-mono);
    color: var(--text-2);
    min-width: 36px;
    text-align: right;
  }
  .task-row.done .pct, .task-row.queued .pct { color: var(--text-3); }
  .task-row .queued-label {
    font: 500 10px/1 var(--font-mono);
    color: var(--text-3);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  .panel-foot {
    padding: 10px 12px 12px;
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    border-top: 1px solid var(--border);
  }
  .shell[data-panel="header"] .panel-foot { border-top: none; padding-top: 0; padding-bottom: 4px; }

  /* members card under agent panel */
  .members-card { margin-top: 12px; }
  .shell[data-panel="header"] .members-card { display: none; }
  .panel-card.members .panel-head { border-bottom: 1px solid var(--border); }
  .members-list { padding: 8px 4px 10px; }
  .member-row {
    display: grid;
    grid-template-columns: 28px 1fr auto;
    gap: 10px;
    align-items: center;
    padding: 7px 10px;
    border-radius: var(--r-2);
  }
  .member-row:hover { background: var(--surface-2); }
  .member-row .av {
    width: 24px; height: 24px;
    border-radius: 50%;
    background: var(--surface-3);
    display: grid; place-items: center;
    font-size: 10px;
    font-weight: 600;
    color: var(--text);
    border: 1px solid var(--border-2);
  }
  .member-row .av.agent {
    border-radius: var(--r-1);
    font-family: var(--font-mono);
    font-size: 10px;
  }
  .member-row .name { font-size: 13px; color: var(--text); display: flex; align-items: center; gap: 6px; }
  .member-row .name .agent-mini {
    font: 600 9px/1 var(--font-mono);
    border: 1px solid var(--text-3);
    padding: 1px 4px;
    border-radius: 2px;
    letter-spacing: 0.06em;
    color: var(--text-2);
  }
  .member-row .presence {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--pos);
    box-shadow: 0 0 0 2px var(--surface);
  }
  .member-row .presence.away { background: var(--text-4); }

  /* ---------- call inlay ---------- */
  .call-inlay {
    border: 1px solid var(--border);
    border-radius: var(--r-4);
    background: var(--surface);
    margin: 6px 0 10px;
    overflow: hidden;
    box-shadow: var(--shadow-1);
  }
  .call-inlay[data-state="ringing"]    { border-color: color-mix(in oklab, var(--busy) 40%, var(--border)); }
  .call-inlay[data-state="active"]     { border-color: color-mix(in oklab, var(--pos)  40%, var(--border)); }
  .call-inlay[data-state="ended"]      { border-color: var(--border); opacity: 0.92; }
  .call-inlay[data-state="missed"]     { border-color: color-mix(in oklab, var(--neg) 35%, var(--border)); }

  .call-inlay .ci-head {
    padding: 12px 14px;
    display: grid;
    grid-template-columns: 32px 1fr auto;
    gap: 12px;
    align-items: center;
    border-bottom: 1px solid var(--border);
  }
  .call-inlay .ci-head .icon {
    width: 32px; height: 32px;
    border-radius: var(--r-2);
    display: grid; place-items: center;
    background: var(--surface-2);
    color: var(--text-2);
    border: 1px solid var(--border);
  }
  .call-inlay[data-state="ringing"] .ci-head .icon {
    background: color-mix(in oklab, var(--busy) 14%, transparent);
    color: var(--busy);
    border-color: color-mix(in oklab, var(--busy) 30%, var(--border));
    animation: ringPulse 1.4s ease-in-out infinite;
  }
  .call-inlay[data-state="active"] .ci-head .icon {
    background: color-mix(in oklab, var(--pos) 14%, transparent);
    color: var(--pos);
    border-color: color-mix(in oklab, var(--pos) 30%, var(--border));
  }
  .call-inlay[data-state="missed"] .ci-head .icon {
    background: color-mix(in oklab, var(--neg) 14%, transparent);
    color: var(--neg);
    border-color: color-mix(in oklab, var(--neg) 30%, var(--border));
  }
  @keyframes ringPulse {
    0%, 100% { box-shadow: 0 0 0 0 color-mix(in oklab, var(--busy) 40%, transparent); }
    50%      { box-shadow: 0 0 0 6px color-mix(in oklab, var(--busy) 0%, transparent); }
  }
  .call-inlay .ci-head .title-block { min-width: 0; }
  .call-inlay .ci-head .title {
    font-size: 13.5px;
    font-weight: 600;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .call-inlay .ci-head .sub {
    font-size: 12px;
    color: var(--text-3);
    margin-top: 2px;
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }
  .call-inlay .ci-head .sub .dot { width: 3px; height: 3px; border-radius: 50%; background: var(--text-4); }
  .call-inlay .ci-head .duration {
    font: 600 13px/1 var(--font-mono);
    color: var(--text);
    padding: 6px 10px;
    border-radius: var(--r-2);
    background: var(--surface-2);
    border: 1px solid var(--border);
    letter-spacing: 0.04em;
    font-variant-numeric: tabular-nums;
  }
  .call-inlay[data-state="active"] .ci-head .duration {
    color: var(--pos);
    background: color-mix(in oklab, var(--pos) 10%, transparent);
    border-color: color-mix(in oklab, var(--pos) 25%, var(--border));
  }

  .call-inlay .always-broadcast {
    padding: 8px 14px;
    display: flex;
    align-items: center;
    gap: 8px;
    font: 500 11.5px/1.4 var(--font-sans);
    color: var(--text-3);
    background: var(--surface-2);
    border-bottom: 1px solid var(--border);
  }
  .call-inlay .always-broadcast .lock {
    font: 600 9.5px/1 var(--font-mono);
    color: var(--text);
    background: var(--surface);
    border: 1px solid var(--border-2);
    padding: 3px 6px;
    border-radius: 3px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .call-inlay .always-broadcast .why {
    color: var(--text-2);
    flex: 1;
  }

  .call-inlay .participants {
    padding: 12px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 8px;
  }
  .call-tile {
    border: 1px solid var(--border);
    border-radius: var(--r-3);
    background: var(--surface);
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-height: 84px;
    position: relative;
    overflow: hidden;
  }
  .call-tile[data-conn="joined"]   { border-color: color-mix(in oklab, var(--pos) 35%, var(--border)); }
  .call-tile[data-conn="ringing"]  { border-color: color-mix(in oklab, var(--busy) 35%, var(--border)); background: color-mix(in oklab, var(--busy) 5%, var(--surface)); }
  .call-tile[data-conn="declined"] { opacity: 0.72; }
  .call-tile[data-conn="self"]     { border-color: color-mix(in oklab, var(--accent) 50%, var(--border)); background: color-mix(in oklab, var(--accent) 5%, var(--surface)); }

  .call-tile .row1 {
    display: flex; align-items: center; gap: 8px;
    min-width: 0;
  }
  .call-tile .av {
    width: 26px; height: 26px;
    border-radius: 50%;
    background: var(--surface-3);
    color: white;
    font-size: 11px;
    font-weight: 600;
    display: grid; place-items: center;
    flex-shrink: 0;
  }
  .call-tile .av.agent {
    border-radius: var(--r-1);
    background: var(--surface-3);
    color: var(--text);
    font-family: var(--font-mono);
    font-size: 10px;
    border: 1px solid var(--border-2);
  }
  .call-tile .nm {
    font-size: 12.5px;
    font-weight: 600;

  .call-tile[data-conn="declined"] .row2 .state  { color: var(--neg); }
  .call-tile[data-conn="self"] .row2 .state      { color: var(--accent); }
  .call-tile .row2 .state .pip {

  .call-tile .row2 .indicators {

  .call-tile .level {

  .call-tile .level span:nth-child(3) { animation-delay: 0.30s; height: 13px; }

  .call-inlay .ci-actions .ico-toggle[aria-pressed="true"] {

  .call-inlay .ci-actions .join {

  .detail .m-head .lockup h2 {

  .detail .m-head .lockup .sub {
    margin-top: 2px;
    font-size: 12px;
    color: var(--text-3);

    align-items: center;
    gap: 6px;

  .detail .m-head .lockup .sub .dot { width: 3px; height: 3px; border-radius: 50%; background: var(--text-4); }

  .detail .m-body {
    padding: 0;

  .cap-target {
    font-family: var(--font-mono);
    font-size: 14px;
    color: var(--text);
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: var(--r-2);
    padding: 10px 12px;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    word-break: break-all;

  .cap-target .verb { color: var(--accent); font-weight: 600; }
  .cap-target .arg  { color: var(--text); }
  .cap-target .scope-tag {
    margin-left: auto;
    font: 500 10px/1 var(--font-mono);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--warn);
    background: color-mix(in oklab, var(--warn) 12%, transparent);

    margin-top: 10px;
    font-size: 13px;
    line-height: 1.55;
    color: var(--text-2);

  .scope-grid {
    display: grid;
    grid-template-columns: max-content 1fr;
    gap: 10px 18px;
    font-size: 13px;
  }
  .scope-grid .k { color: var(--text-3); font: 500 11px/1.4 var(--font-mono); text-transform: uppercase; letter-spacing: 0.04em; padding-top: 2px; }
  .scope-grid .v { color: var(--text); }
  .scope-grid .v code { font: 500 12.5px/1.4 var(--font-mono); background: var(--surface-2); border: 1px solid var(--border); padding: 1px 5px; border-radius: 4px; }

  .plan-list {
    list-style: none;
    padding: 0; margin: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;

  .plan-list li {
    display: grid;
    grid-template-columns: 22px 1fr;
    gap: 10px;
    font-size: 13px;
    line-height: 1.5;
    color: var(--text);
  }
  .plan-list li .n {
    font: 600 11px/22px var(--font-mono);
    color: var(--text-3);
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 50%;
    text-align: center;
    height: 22px;

  .provenance {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .provenance .row {
    display: grid;
    grid-template-columns: 16px 1fr auto;
    gap: 10px;
    align-items: center;
    font-size: 13px;

    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: var(--r-2);
    background: var(--surface);

    flex: 1;

    background: var(--surface);

    flex-direction: column;
    gap: 4px;
  }
  .post-actions .info-tile .t {
    font-size: 12px;
    font-weight: 600;
    color: var(--text);
    display: flex; align-items: center; gap: 6px;
  }
  .post-actions .info-tile .d {
    font-size: 12px;
    color: var(--text-3);
    line-height: 1.5;
  }

  .detail .m-foot {
    padding: 14px 22px 18px;
    display: flex;
    align-items: center;
    gap: 10px;
    border-top: 1px solid var(--border);
    background: var(--surface-2);
  }
  .detail .m-foot .timer {
    font: 500 11px/1 var(--font-mono);
    color: var(--warn);
    background: color-mix(in oklab, var(--warn) 10%, transparent);
    border: 1px solid color-mix(in oklab, var(--warn) 30%, var(--border));
    padding: 5px 8px;
    border-radius: var(--r-1);
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .detail .m-foot .grow { flex: 1; }
  .scrim {
    position: fixed; inset: 0;
    background: color-mix(in oklab, oklch(0.05 0.01 260) 50%, transparent);
    backdrop-filter: blur(2px);
    -webkit-backdrop-filter: blur(2px);
    z-index: 50;
    display: grid;
    place-items: center;
    padding: 24px;
    animation: scrimIn 160ms ease-out;
  }
  @keyframes scrimIn { from { opacity: 0; } to { opacity: 1; } }
  .modal {
    width: min(480px, 100%);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-4);
    box-shadow: var(--shadow-3);
    overflow: hidden;
    animation: modalIn 180ms cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  @keyframes modalIn { from { transform: translateY(8px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  .modal .m-head {
    padding: 16px 18px 12px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .modal .m-head h2 {
    margin: 0;
    font-size: 15px;
    font-weight: 600;
  }
  .modal .m-head .meta {
    margin-left: auto;
    font: 500 11px/1 var(--font-mono);
    color: var(--text-3);
  }
  .modal .m-head .x {
    background: none; border: none; cursor: pointer;
    width: 28px; height: 28px;
    border-radius: var(--r-2);
    color: var(--text-3);
    display: grid; place-items: center;
  }
  .modal .m-head .x:hover { background: var(--surface-2); color: var(--text); }
  .modal .m-body {
    padding: 4px 18px 18px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label {
    font-size: 12px;
    color: var(--text-2);
    font-weight: 500;
  }
  .field textarea, .field input[type="text"], .field select {
    border: 1px solid var(--border);
    background: var(--surface);
    border-radius: var(--r-2);
    padding: 9px 11px;
    font-size: 13.5px;
    color: var(--text);
    outline: none;
  }
  .field textarea { resize: vertical; min-height: 76px; line-height: 1.5; }
  .field textarea:focus, .field input:focus, .field select:focus {
    border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft);
  }

  .seg {
    display: inline-flex;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: var(--r-2);
    padding: 2px;
    gap: 2px;
    align-self: flex-start;
  }
  .seg button {
    border: none; background: transparent;
    padding: 6px 12px;
    border-radius: 4px;
    font-size: 12.5px;
    font-weight: 500;
    color: var(--text-2);
    cursor: pointer;
  }
  .seg button[aria-pressed="true"] {
    background: var(--surface);
    color: var(--text);
    box-shadow: var(--shadow-1);
    font-weight: 600;
  }

  .modal .m-foot {
    padding: 12px 18px 16px;
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    border-top: 1px solid var(--border);
    background: var(--surface-2);
  }

  /* welcome empty state */
  .welcome {
    height: 100%;
    display: grid;
    place-items: center;
    padding: 40px;
    text-align: center;
  }
  .welcome .card {
    max-width: 440px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    align-items: center;
  }
  .welcome h1 { margin: 0; font-size: 22px; letter-spacing: -0.02em; font-weight: 600; }
  .welcome p { margin: 0; color: var(--text-2); }
  .welcome .mark {
    width: 56px; height: 56px;
    border-radius: var(--r-4);
    background: var(--surface);
    border: 1px solid var(--border);
    display: grid; place-items: center;
    margin-bottom: 6px;
    box-shadow: var(--shadow-1);
  }

  /* ============== Tweaks panel container override ============== */
  .tweaks-panel { font-family: var(--font-sans) !important; }

  /* ============== Detail-modal additions (poll/task/call) ============== */

  /* Header icon-wrap tint variants */
  .detail .m-head .lockup .icon-wrap.poll {
    background: color-mix(in oklab, var(--accent) 14%, transparent);
    color: var(--accent);
  }
  .detail .m-head .lockup .icon-wrap.task {
    background: var(--pos-soft);
    color: var(--pos);
  }
  .detail .m-head .lockup .icon-wrap.call {
    background: var(--surface-2);
    color: var(--text-2);
  }
  .detail .m-head .lockup .icon-wrap.call.state-active   { background: color-mix(in oklab, var(--pos)  14%, transparent); color: var(--pos);  }
  .detail .m-head .lockup .icon-wrap.call.state-ringing  { background: color-mix(in oklab, var(--busy) 14%, transparent); color: var(--busy); }
  .detail .m-head .lockup .icon-wrap.call.state-missed   { background: color-mix(in oklab, var(--neg)  14%, transparent); color: var(--neg);  }
  .detail .m-head .lockup h2 { text-wrap: pretty; }

  /* Mini avatar (used inside provenance rows and poll chips) */
  .dm-av {
    border-radius: 50%;
    color: white;
    display: grid; place-items: center;
    font-size: 9.5px;
    font-weight: 600;
    flex-shrink: 0;
    background: var(--text-3);
  }
  .dm-av.agent {
    border-radius: 3px;
    background: var(--surface-3);
    color: var(--text);
    font-family: var(--font-mono);
    font-size: 9px;
    border: 1px solid var(--border-2);
  }

  /* ---- Poll details ---- */
  .poll-leader {
    border: 1px solid var(--border);
    background: var(--surface-2);
    border-radius: var(--r-3);
    padding: 12px 14px;
    position: relative;
    overflow: hidden;
  }
  .poll-leader .big .lab {
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    letter-spacing: -0.005em;
  }
  .poll-leader .big .meta {
    margin-top: 4px;
    font: 500 12px/1 var(--font-mono);
    color: var(--text-3);
    letter-spacing: 0.02em;
  }
  .poll-leader-bar {
    position: absolute;
    left: 0; bottom: 0; height: 3px;
    background: var(--accent);
    transition: width 350ms cubic-bezier(0.2, 0.7, 0.2, 1);
  }

  .poll-breakdown { display: flex; flex-direction: column; gap: 12px; }
  .poll-bd {
    border: 1px solid var(--border);
    border-radius: var(--r-3);
    padding: 10px 12px;
    background: var(--surface);
    display: flex;
    flex-direction: column;
    gap: 8px;

  .poll-bd[data-selected="true"] {

  .poll-bd-row .ct  { font: 600 12px/1 var(--font-mono); color: var(--text-2); }
  .poll-bd-row .pct { font: 600 12px/1 var(--font-mono); color: var(--text-3); min-width: 36px; text-align: right; }
  .poll-bd[data-selected="true"] .poll-bd-row .pct { color: var(--accent); }

  .poll-bd-bar {
    height: 5px;
    background: var(--surface-3);
    border-radius: 999px;
    overflow: hidden;
  }
  .poll-bd-bar > span {
    display: block;
    height: 100%;
    background: var(--accent);
    border-radius: 999px;
    transition: width 350ms cubic-bezier(0.2, 0.7, 0.2, 1);
  }
  .poll-bd[data-selected="true"] .poll-bd-bar > span { background: var(--accent); }

  .poll-bd-voters {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 6px;
  }
  .poll-bd-voters .chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--text-2);
    padding: 3px 8px 3px 4px;
    border-radius: 999px;
    background: var(--surface-2);
    border: 1px solid var(--border);

  .poll-bd-voters .empty {
    font: 500 11px/1 var(--font-mono);
    color: var(--text-4);
    padding: 4px 0;

  .poll-bd-voters .vote-here { margin-left: auto; }
  .poll-bd-voters .you-voted {
    margin-left: auto;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font: 600 10.5px/1 var(--font-mono);
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  /* ---- Task details ---- */
  .cap-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .cap-row {
    display: grid;
    grid-template-columns: 1fr auto auto;
    align-items: center;
    gap: 10px;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: var(--r-2);
    background: var(--surface);
  }
  .cap-row .cap-name {
    font: 500 12.5px/1.3 var(--font-mono);
    color: var(--text);
    word-break: break-all;
  }
  .cap-row .cap-scope {
    font: 500 11px/1 var(--font-mono);
    color: var(--text-3);
    background: var(--surface-2);
    border: 1px solid var(--border);
    padding: 3px 6px;
    border-radius: 4px;
  }
  .cap-row .cap-tag {
    font: 500 10px/1 var(--font-mono);
    color: var(--pos);
    background: var(--pos-soft);
    border: 1px solid color-mix(in oklab, var(--pos) 30%, var(--border));
    padding: 3px 6px;
    border-radius: 4px;
    text-transform: uppercase;
    letter-spacing: 0.06em;

  .readings-grid .reading {
    border: 1px solid var(--border);
    background: var(--surface);
    border-radius: var(--r-2);
    padding: 10px 12px;

  .readings-grid .reading .k {
    font: 500 10.5px/1 var(--font-mono);
    color: var(--text-3);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 6px;
  }
  .readings-grid .reading .v {
    font-size: 17px;
    font-weight: 600;
    letter-spacing: -0.01em;
    color: var(--text);
  }
  .readings-grid .reading .n {
    margin-top: 3px;
    font-size: 12px;
    color: var(--text-3);
  }

    display: flex;
    flex-direction: column;
    gap: 6px;

  .pt-row {
    display: grid;
    grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr) auto;
